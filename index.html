<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Auto Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0E2A2F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Auto Link">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <img src="images/logo.png" alt="" class="logo" onerror="this.style.display='none'">
      <h1>Auto Link</h1>
      <button id="installBtn" class="btn small" hidden>Install app</button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Main">
      <a href="#home" data-tab="home">Home</a>
      <a href="#services" data-tab="services">Services</a>
      <a href="#shop" data-tab="shop">Shop</a>
      <a href="#cart" data-tab="cart">Cart<span id="badge" class="badge" hidden>0</span></a>
      <a href="#orders" data-tab="orders">Orders</a>
      <a href="#account" data-tab="account">Account</a>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
